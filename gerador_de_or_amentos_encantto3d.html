<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encantto3D • Gerador de Orçamentos</title>

  <!-- Google Fonts: Plus Jakarta Sans, Space Grotesk & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            display: ['"Space Grotesk"', '"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
          colors: {
            brand: {
              lime: '#CCF046',
              limeHover: '#BFE632',
              pink: '#F51B8E',
              pinkHover: '#DC117C',
              black: '#0D0E0C',
              green: '#34C73B',
              whatsapp: '#25D366',
              lightBg: '#F4F4EE',
              lightCard: '#FAF9F5',
              darkBg: '#111210',
              darkCard: '#1A1C18',
              darkElevated: '#232620',
              darkBorder: '#2E322B',
            }
          },
          boxShadow: {
            'brutal': '4px 4px 0px #0D0E0C',
            'brutal-sm': '3px 3px 0px #0D0E0C',
            'brutal-xs': '2px 2px 0px #0D0E0C',
            'brutal-lime': '3px 3px 0px #CCF046',
            'brutal-dark': '4px 4px 0px #060706',
          }
        }
      }
    };
  </script>

  <style>
    /* Física tátil neo-brutalista para botões principais */
    .btn-brutal {
      transition: transform 0.14s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.14s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.15s ease;
    }
    .btn-brutal:hover {
      transform: translate(-1px, -1px);
    }
    .btn-brutal:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #0D0E0C !important;
    }

    /* Animação suave de entrada para novas peças e transições de etapa */
    @keyframes popSlideIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .animate-piece-in {
      animation: popSlideIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Linhas interativas clicáveis/tocáveis no resultado final */
    .editable-segment {
      position: relative;
      display: block;
      border-radius: 0.65rem;
      padding: 0.35rem 0.55rem;
      margin: 0 -0.55rem;
      transition: background-color 0.15s ease, transform 0.12s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }
    .editable-segment:hover,
    .editable-segment:focus-visible {
      background-color: rgba(204, 240, 70, 0.32);
      box-shadow: inset 0 0 0 1.5px #0D0E0C;
      outline: none;
    }
    .dark .editable-segment:hover,
    .dark .editable-segment:focus-visible {
      background-color: rgba(204, 240, 70, 0.16);
      box-shadow: inset 0 0 0 1.5px #CCF046;
    }
    .editable-segment:active {
      transform: scale(0.992);
    }

    /* Scrollbar estilizada */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(13, 14, 12, 0.25);
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(204, 240, 70, 0.28);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #F51B8E;
    }

    /* Remove setas nativas nos inputs numéricos */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
  </style>
</head>

<body class="relative bg-brand-lightBg text-brand-black dark:bg-brand-darkBg dark:text-[#F4F4EE] min-h-screen transition-colors duration-300 selection:bg-brand-lime selection:text-brand-black overflow-x-hidden">

  <!-- =====================================================================
       CABEÇALHO OFICIAL ENCANTTO3D (CARBON BLACK + LIME + MAGENTA)
  ====================================================================== -->
  <header class="sticky top-0 z-30 bg-brand-black text-white border-b-2 border-brand-lime">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
      <!-- Logotipo Encantto3D SVG -->
      <div class="flex items-center gap-3">
        <svg class="h-10 w-auto shrink-0" viewBox="0 0 210 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Encantto3D">
          <!-- Formas geométricas maker acima do logo -->
          <path d="M52 7L57 12M57 7L52 12" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
          <polygon points="73,6 81,13 71,16" fill="#CCF046"/>
          <circle cx="94" cy="11" r="4" fill="#F51B8E"/>
          <!-- Tipografia Encantto 3D com engrenagem no lugar do 'o' -->
          <text x="4" y="42" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="25" letter-spacing="-0.5">Encantt</text>
          <g transform="translate(103, 33)">
            <circle cx="0" cy="0" r="6.5" stroke="#CCF046" stroke-width="2.6"/>
            <circle cx="0" cy="0" r="2" fill="#F51B8E"/>
            <path d="M0 -9.5V-7M0 7V9.5M-9.5 0H-7M7 0H9.5M-6.7 -6.7L-5 -5M5 5L6.7 6.7M6.7 -6.7L5 -5M-5 5L-6.7 6.7" stroke="#CCF046" stroke-width="2.1" stroke-linecap="round"/>
          </g>
          <text x="118" y="42" fill="#CCF046" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="25" letter-spacing="-0.5">3D</text>
        </svg>

        <span class="hidden sm:inline-flex items-center px-2.5 py-1 rounded-full bg-white/10 border border-white/15 text-[11px] font-bold text-brand-lime tracking-wide">
          Proposta Comercial
        </span>
      </div>

      <!-- Alternar Tema Claro / Escuro -->
      <button
        id="theme-toggle"
        type="button"
        aria-label="Alternar tema claro ou escuro"
        class="h-10 px-3.5 rounded-full bg-white/10 hover:bg-brand-lime hover:text-brand-black text-white border border-white/20 hover:border-brand-black flex items-center gap-2 text-xs font-extrabold transition-colors cursor-pointer"
      >
        <svg id="icon-sun" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg id="icon-moon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <span id="theme-label">Modo Escuro</span>
      </button>
    </div>
  </header>

  <!-- =====================================================================
       CONTEÚDO PRINCIPAL: WIZARD PASSO A PASSO + RESULTADO INTERATIVO
  ====================================================================== -->
  <main class="relative z-10 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">

    <!-- Barra de Progresso do Passo a Passo -->
    <div id="wizard-progress-bar" class="mb-6 bg-brand-lightCard dark:bg-brand-darkCard rounded-2xl p-3.5 sm:p-4 border-2 border-brand-black dark:border-brand-darkBorder shadow-brutal-sm dark:shadow-brutal-dark">
      <div class="flex items-center justify-between gap-2 mb-2.5">
        <div class="flex items-center gap-2">
          <span id="step-pill-badge" class="px-2.5 py-0.5 rounded-full bg-brand-black text-brand-lime font-display font-extrabold text-[11px] uppercase tracking-wider">
            Passo 1 de 5
          </span>
          <span id="step-title-indicator" class="font-display font-bold text-xs sm:text-sm text-brand-black dark:text-white">
            Dados do Atendimento
          </span>
        </div>

        <button
          id="jump-to-result-btn"
          type="button"
          class="hidden px-3 py-1 rounded-full bg-brand-lime hover:bg-brand-limeHover text-brand-black border-[1.5px] border-brand-black text-[11px] font-extrabold transition-colors cursor-pointer"
        >
          Ver Resultado →
        </button>
      </div>

      <!-- Trilho visual de etapas -->
      <div class="grid grid-cols-5 gap-1.5 sm:gap-2">
        <div data-progress-seg="0" class="h-2 rounded-full bg-brand-pink border border-brand-black transition-all"></div>
        <div data-progress-seg="1" class="h-2 rounded-full bg-brand-black/15 dark:bg-white/15 border border-brand-black/30 transition-all"></div>
        <div data-progress-seg="2" class="h-2 rounded-full bg-brand-black/15 dark:bg-white/15 border border-brand-black/30 transition-all"></div>
        <div data-progress-seg="3" class="h-2 rounded-full bg-brand-black/15 dark:bg-white/15 border border-brand-black/30 transition-all"></div>
        <div data-progress-seg="4" class="h-2 rounded-full bg-brand-black/15 dark:bg-white/15 border border-brand-black/30 transition-all"></div>
      </div>
    </div>

    <!-- Container Dinâmico da Tela Atual do Passo a Passo -->
    <div id="wizard-stage"></div>

  </main>

  <!-- =====================================================================
       POPUP DE EDIÇÃO RÁPIDA (AO TOCAR EM QUALQUER PARTE DO TEXTO FINAL)
  ====================================================================== -->
  <div
    id="quick-edit-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="quick-edit-title"
    class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-brand-black/70 backdrop-blur-md transition-opacity duration-200"
  >
    <div class="w-full max-w-lg rounded-3xl bg-brand-lightCard dark:bg-brand-darkCard border-2 border-brand-black dark:border-brand-lime shadow-brutal dark:shadow-brutal-dark p-5 sm:p-6 animate-piece-in">
      <!-- Cabeçalho do Popup de Edição -->
      <div class="flex items-center justify-between gap-3 pb-3.5 border-b-2 border-brand-black/10 dark:border-brand-darkBorder">
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-2xl bg-brand-lime text-brand-black border-2 border-brand-black shadow-brutal-xs flex items-center justify-center shrink-0">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
          </div>
          <div>
            <span id="quick-edit-badge" class="inline-block px-2 py-0.5 rounded bg-brand-black text-brand-lime text-[10px] font-extrabold uppercase tracking-wider mb-0.5">
              Edição Rápida
            </span>
            <h3 id="quick-edit-title" class="font-display text-lg font-extrabold tracking-tight text-brand-black dark:text-white">
              Editar Campo
            </h3>
          </div>
        </div>

        <button
          id="quick-edit-close-btn"
          type="button"
          aria-label="Fechar popup"
          class="w-9 h-9 rounded-xl bg-white dark:bg-brand-darkElevated hover:bg-brand-pink hover:text-white text-brand-black dark:text-white border-2 border-brand-black dark:border-brand-darkBorder flex items-center justify-center transition-colors cursor-pointer"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Conteúdo Dinâmico do Campo em Edição -->
      <div id="quick-edit-body" class="mt-4 space-y-4"></div>

      <!-- Botões de Confirmação do Popup -->
      <div class="mt-5 pt-4 border-t-2 border-brand-black/10 dark:border-brand-darkBorder flex items-center justify-end gap-2.5">
        <button
          id="quick-edit-cancel-btn"
          type="button"
          class="h-11 px-4 rounded-xl bg-white dark:bg-brand-darkElevated hover:bg-gray-100 dark:hover:bg-white/10 text-brand-black dark:text-gray-200 border-2 border-brand-black dark:border-brand-darkBorder font-display font-bold text-sm transition-colors cursor-pointer"
        >
          Cancelar
        </button>
        <button
          id="quick-edit-save-btn"
          type="button"
          class="btn-brutal h-11 px-5 rounded-xl bg-brand-pink hover:bg-brand-pinkHover text-white font-display font-bold text-sm border-2 border-brand-black shadow-brutal-xs flex items-center gap-1.5 cursor-pointer"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span>Salvar Alteração</span>
        </button>
      </div>
    </div>
  </div>

  <!-- =====================================================================
       NOTIFICAÇÃO TOAST FLUTUANTE COM SUPORTE A 'DESFAZER'
  ====================================================================== -->
  <div
    id="toast"
    role="status"
    aria-live="polite"
    class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 translate-y-3 transition-all duration-300"
  >
    <div class="pointer-events-auto flex items-center gap-3 px-4 py-2.5 rounded-full bg-brand-black text-white border-2 border-brand-lime shadow-brutal text-xs sm:text-sm font-bold">
      <span class="w-2.5 h-2.5 rounded-full bg-brand-lime shrink-0"></span>
      <span id="toast-message">Orçamento copiado!</span>
      <button
        id="toast-undo-btn"
        type="button"
        class="hidden ml-1 px-3 py-0.5 rounded-full bg-brand-pink text-white text-xs font-extrabold hover:bg-brand-pinkHover transition-colors cursor-pointer"
      >
        Desfazer
      </button>
    </div>
  </div>

  <!-- =====================================================================
       MODAL DE AVISO DE SEGURANÇA (CAMPOS NÃO PREENCHIDOS AO COPIAR)
  ====================================================================== -->
  <div
    id="validation-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="validation-modal-title"
    class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-brand-black/70 backdrop-blur-md transition-opacity duration-200"
  >
    <div
      id="validation-modal-card"
      class="w-full max-w-md rounded-3xl bg-brand-lightCard dark:bg-brand-darkCard border-2 border-brand-black dark:border-brand-lime shadow-brutal dark:shadow-brutal-dark p-5 sm:p-6 animate-piece-in"
    >
      <!-- Cabeçalho do Aviso -->
      <div class="flex items-start gap-3 pb-3.5 border-b-2 border-brand-black/10 dark:border-brand-darkBorder">
        <div class="w-11 h-11 rounded-2xl bg-brand-pink text-white border-2 border-brand-black shadow-brutal-xs flex items-center justify-center shrink-0">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
        <div>
          <span class="inline-block px-2 py-0.5 rounded bg-brand-lime text-brand-black text-[10px] font-extrabold uppercase tracking-wider mb-1">
            Aviso de Segurança
          </span>
          <h3 id="validation-modal-title" class="font-display text-lg font-extrabold tracking-tight text-brand-black dark:text-white">
            Dados não preenchidos
          </h3>
        </div>
      </div>

      <!-- Mensagem & Lista de Campos Faltantes -->
      <div class="mt-3.5">
        <p class="text-xs sm:text-sm font-semibold text-brand-black/80 dark:text-gray-300 leading-relaxed">
          Os seguintes dados ainda não foram preenchidos no orçamento. Deseja continuar e copiar mesmo assim?
        </p>

        <ul
          id="missing-fields-list"
          class="mt-3 max-h-52 overflow-y-auto space-y-2 pr-1"
        ></ul>
      </div>

      <!-- Botões de Ação: Editar ou Sim, continuar -->
      <div class="mt-5 pt-4 border-t-2 border-brand-black/10 dark:border-brand-darkBorder grid grid-cols-2 gap-3">
        <button
          id="modal-edit-btn"
          type="button"
          class="btn-brutal h-11 px-4 rounded-xl bg-brand-lime hover:bg-brand-limeHover text-brand-black font-display font-extrabold text-sm border-2 border-brand-black shadow-brutal-xs flex items-center justify-center gap-1.5 cursor-pointer"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          <span>Editar</span>
        </button>

        <button
          id="modal-confirm-copy-btn"
          type="button"
          class="btn-brutal h-11 px-4 rounded-xl bg-brand-pink hover:bg-brand-pinkHover text-white font-display font-bold text-sm border-2 border-brand-black shadow-brutal-xs flex items-center justify-center gap-1.5 cursor-pointer"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span>Sim, continuar</span>
        </button>
      </div>
    </div>
  </div>

  <!-- =====================================================================
       LÓGICA DA APLICAÇÃO (JAVASCRIPT)
  ====================================================================== -->
  <script>
    /**
     * Gerador de Propostas Comerciais – Encantto3D
     * Fluxo Passo a Passo com Modelagem como Adição & Edição Interativa por Toque no Resultado Final.
     */
    (function () {
      'use strict';

      const STORAGE_KEYS = {
        SELLER: 'encantto3d_vendedor_v1',
        THEME: 'encantto3d_theme_v1'
      };

      const SELLERS = [
        'Gabriel Smanioto',
        'Ana Clara',
        'Gabriel Quintino',
        'Layane Martis'
      ];

      const MATERIALS = ['PLA', 'PETG', 'ABS', 'TPU', 'RESINA', 'ASA', 'ALTA ENGENHARIA'];
      const ENGINEERING_HOURLY_RATE = 100;

      // Etapas do fluxo:
      // 'atendimento' -> 'piece-modeling-ask' -> 'piece-modeling-type' (se modelada) -> 'piece-details' -> 'piece-painting' -> 'result'
      let state = {
        step: 'atendimento',
        currentPieceIndex: 0,
        hasVisitedResult: false,
        clientName: '',
        sellerName: '',
        deliveryDays: '7',
        hasInstallments: false,
        installmentsCount: '10',
        pieces: []
      };

      let lastSnapshotBeforeReset = null;
      let toastTimer = null;
      let pieceUidCounter = 1;
      let firstMissingItem = null;
      let activeQuickEdit = null;

      // Referências aos elementos fixos do DOM
      const dom = {
        wizardProgressBar: document.getElementById('wizard-progress-bar'),
        stepPillBadge: document.getElementById('step-pill-badge'),
        stepTitleIndicator: document.getElementById('step-title-indicator'),
        jumpToResultBtn: document.getElementById('jump-to-result-btn'),
        progressSegments: document.querySelectorAll('[data-progress-seg]'),
        wizardStage: document.getElementById('wizard-stage'),
        themeToggle: document.getElementById('theme-toggle'),
        iconSun: document.getElementById('icon-sun'),
        iconMoon: document.getElementById('icon-moon'),
        themeLabel: document.getElementById('theme-label'),
        toast: document.getElementById('toast'),
        toastMessage: document.getElementById('toast-message'),
        toastUndoBtn: document.getElementById('toast-undo-btn'),
        validationModal: document.getElementById('validation-modal'),
        missingFieldsList: document.getElementById('missing-fields-list'),
        modalEditBtn: document.getElementById('modal-edit-btn'),
        modalConfirmCopyBtn: document.getElementById('modal-confirm-copy-btn'),
        quickEditModal: document.getElementById('quick-edit-modal'),
        quickEditBadge: document.getElementById('quick-edit-badge'),
        quickEditTitle: document.getElementById('quick-edit-title'),
        quickEditBody: document.getElementById('quick-edit-body'),
        quickEditCloseBtn: document.getElementById('quick-edit-close-btn'),
        quickEditCancelBtn: document.getElementById('quick-edit-cancel-btn'),
        quickEditSaveBtn: document.getElementById('quick-edit-save-btn')
      };

      // Cria uma nova peça com modelagem como adição opcional
      function createDefaultPiece() {
        return {
          uid: pieceUidCounter++,
          hasModeling: false,
          modelingType: 'ARTISTICA', // 'ARTISTICA' | 'ENGENHARIA'
          modelingArtisticScope: 'COMPLETA', // 'AJUSTE' | 'COMPLETA'
          modelingArtisticPriceRaw: '',
          modelingEngineeringHours: '',
          modelingNotes: '',
          name: '',
          measureMode: 'single', // 'single' | 'triple'
          singleMeasure: '',
          dimL: '',
          dimA: '',
          dimP: '',
          quantity: 1,
          material: 'PLA',
          printType: 'COLORIDA',
          priceRaw: '',
          hasPainting: false,
          paintDetail: '',
          paintPriceRaw: ''
        };
      }

      function escapeAttr(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function formatPieceMeasure(piece) {
        if (piece.measureMode === 'triple') {
          const parts = [piece.dimL, piece.dimA, piece.dimP]
            .map((v) => String(v || '').trim())
            .filter(Boolean)
            .map((v) => (/cm$/i.test(v) ? v : `${v}cm`));
          return parts.length ? parts.join(' x ') : '[MEDIDA]';
        }

        const raw = String(piece.singleMeasure || '').trim();
        if (!raw) return '[MEDIDA]';

        if (/[xX×]/.test(raw)) {
          const parts = raw
            .split(/\s*[xX×]\s*/)
            .map((p) => p.trim())
            .filter(Boolean)
            .map((p) => (/cm$/i.test(p) ? p : `${p}cm`));
          return parts.join(' x ');
        }

        return /cm$/i.test(raw) ? raw : `${raw}cm`;
      }

      function parseCurrency(raw) {
        if (!raw) return 0;
        const cleaned = String(raw)
          .replace(/[^\d.,]/g, '')
          .replace(/\./g, '')
          .replace(',', '.');
        const num = parseFloat(cleaned);
        return Number.isFinite(num) && num >= 0 ? num : 0;
      }

      function formatBRL(value) {
        return Number(value || 0).toLocaleString('pt-BR', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      }

      function sanitizeMoneyInput(raw) {
        return String(raw || '').replace(/[^\d.,]/g, '');
      }

      function getPieceModelingValue(piece) {
        if (!piece || !piece.hasModeling) return 0;
        if (piece.modelingType === 'ARTISTICA') {
          return parseCurrency(piece.modelingArtisticPriceRaw);
        }
        const hours = Math.max(0, parseFloat(String(piece.modelingEngineeringHours || '').replace(',', '.')) || 0);
        return hours * ENGINEERING_HOURLY_RATE;
      }

      function getPieceModelingDescription(piece) {
        if (!piece.hasModeling) return 'NÃO';
        let desc = '';
        if (piece.modelingType === 'ARTISTICA') {
          const scopeLabel = piece.modelingArtisticScope === 'AJUSTE'
            ? 'APENAS UM AJUSTE'
            : 'MODELAGEM COMPLETA';
          desc = `ARTÍSTICA (ORGÂNICA) – ${scopeLabel}`;
        } else {
          const hours = Math.max(0, parseFloat(String(piece.modelingEngineeringHours || '').replace(',', '.')) || 0);
          const hoursStr = String(hours).replace('.', ',');
          desc = `ENGENHARIA (${hoursStr}h x R$ 100,00/hora)`;
        }
        const notes = (piece.modelingNotes || '').trim().toUpperCase();
        return notes ? `${desc} – ${notes}` : desc;
      }

      function getCurrentPiece() {
        if (!state.pieces[state.currentPieceIndex]) {
          state.currentPieceIndex = Math.max(0, state.pieces.length - 1);
        }
        return state.pieces[state.currentPieceIndex];
      }

      // Calcula os totais financeiros do orçamento
      function calculateTotals() {
        let totalPrint = 0;
        let totalModeling = 0;
        let totalPainting = 0;
        let hasAnyModeling = false;
        let hasAnyPainting = false;

        state.pieces.forEach((piece) => {
          const printVal = parseCurrency(piece.priceRaw);
          const modVal = getPieceModelingValue(piece);
          const paintVal = piece.hasPainting ? parseCurrency(piece.paintPriceRaw) : 0;

          if (piece.hasModeling) hasAnyModeling = true;
          if (piece.hasPainting) hasAnyPainting = true;

          totalPrint += printVal;
          totalModeling += modVal;
          totalPainting += paintVal;
        });

        const totalGeneral = totalPrint + totalModeling + totalPainting;
        return {
          totalPrint,
          totalModeling,
          totalPainting,
          totalGeneral,
          halfValue: totalGeneral / 2,
          hasAnyModeling,
          hasAnyPainting
        };
      }

      // Gera o texto puro idêntico ao que será copiado e enviado no WhatsApp
      function buildPlainQuoteText() {
        const sectionDivider = '------------------------------';
        const clientUpper = (state.clientName.trim() || '[NOME DO CLIENTE]').toUpperCase();
        const sellerUpper = (state.sellerName.trim() || '[NOME DO VENDEDOR]').toUpperCase();
        const days = Math.max(1, parseInt(state.deliveryDays, 10) || 7);
        const installments = Math.max(2, parseInt(state.installmentsCount, 10) || 10);
        const totals = calculateTotals();

        const headerSubtitle = state.pieces.length > 1
          ? 'IMPRESSÃO 3D – PEÇAS PERSONALIZADAS'
          : 'IMPRESSÃO 3D – PEÇA PERSONALIZADA';

        const pieceBlocks = state.pieces.map((piece, idx) => {
          const numStr = String(idx + 1).padStart(2, '0');
          const pieceNameUpper = (piece.name.trim() || '[NOME DA PEÇA]').toUpperCase();
          const measureFormatted = formatPieceMeasure(piece);
          const qty = Math.max(1, parseInt(piece.quantity, 10) || 1);
          const qtyLabel = qty === 1 ? '1 PEÇA' : `${qty} PEÇAS`;
          const materialUpper = (piece.material || 'PLA').toUpperCase();
          const printUpper = (piece.printType || 'COLORIDA').toUpperCase();
          const modelingText = getPieceModelingDescription(piece);

          let paintingText = 'NÃO';
          if (piece.hasPainting) {
            const detail = (piece.paintDetail || '').trim().toUpperCase();
            paintingText = detail ? `SIM (${detail})` : 'SIM';
          }

          const printVal = parseCurrency(piece.priceRaw);
          const modVal = getPieceModelingValue(piece);
          const paintVal = piece.hasPainting ? parseCurrency(piece.paintPriceRaw) : 0;
          const pieceSubtotal = printVal + modVal + paintVal;
          const hasExtras = piece.hasModeling || piece.hasPainting;

          const lines = [
            `PEÇA ${numStr} – ${pieceNameUpper}`,
            `- Medida principal: ${measureFormatted}`,
            `- Quantidade: ${qtyLabel}`,
            `- Material: ${materialUpper}`,
            `- Impressão: ${printUpper}`,
            `- Modelagem: ${modelingText}`,
            `- Pintura: ${paintingText}`
          ];

          if (hasExtras) {
            lines.push(`- Valor Impressão: R$ ${formatBRL(printVal)}`);
            if (piece.hasModeling) {
              lines.push(`- Valor Modelagem: R$ ${formatBRL(modVal)}`);
            }
            if (piece.hasPainting) {
              lines.push(`- Valor Pintura: R$ ${formatBRL(paintVal)}`);
            }
            lines.push(`- Valor Total da Peça: R$ ${formatBRL(pieceSubtotal)}`);
          } else {
            lines.push(`- Valor: R$ ${formatBRL(printVal)}`);
          }

          return lines.join('\n');
        });

        const summaryLines = [
          'RESUMO DO ORÇAMENTO',
          `IMPRESSÃO: R$ ${formatBRL(totals.totalPrint)}`
        ];
        if (totals.hasAnyModeling || totals.totalModeling > 0) {
          summaryLines.push(`MODELAGEM: R$ ${formatBRL(totals.totalModeling)}`);
        }
        if (totals.hasAnyPainting || totals.totalPainting > 0) {
          summaryLines.push(`PINTURA: R$ ${formatBRL(totals.totalPainting)}`);
        }
        summaryLines.push(`TOTAL GERAL: R$ ${formatBRL(totals.totalGeneral)}`);
        summaryLines.push(`ANTECIPAÇÃO (50%): R$ ${formatBRL(totals.halfValue)}`);

        const paymentSentence = state.hasInstallments
          ? `O pagamento poderá ser realizado via PIX (CNPJ: 64870514000180) ou cartão de crédito (por link de pagamento). PARA ESTE VALOR, CONSEGUIMOS FAZER EM ATÉ ${installments}X SEM JUROS`
          : `O pagamento poderá ser realizado via PIX (CNPJ: 64870514000180) ou cartão de crédito (por link de pagamento).`;

        return [
          `NOME DO CLIENTE: ${clientUpper}\nNOME DO VENDEDOR: ${sellerUpper}`,
          sectionDivider,
          `📣 PROPOSTA COMERCIAL – ENCANTTO3D 📣\n\n${headerSubtitle}\n\n${pieceBlocks.join(`\n\n${sectionDivider}\n\n`)}`,
          sectionDivider,
          summaryLines.join('\n'),
          sectionDivider,
          `PRAZO DE ENTREGA\nPrevisão: ${days} ${days === 1 ? 'dia útil' : 'dias úteis'}, contados após aprovação da proposta e confirmação da antecipação.`,
          sectionDivider,
          `⚠️ ATENÇÃO – CONDIÇÕES DE PAGAMENTO\nPara iniciar a fabricação, é necessário o pagamento antecipado de 50% do valor total do pedido (R$ ${formatBRL(totals.halfValue)}).\n${paymentSentence}\nO valor antecipado será integralmente abatido do valor total, restando os outros 50% (R$ ${formatBRL(totals.halfValue)}) para pagamento na entrega do pedido.`,
          sectionDivider,
          `ESSE ORÇAMENTO TEM UMA VALIDADE DE 10 (DEZ) DIAS CORRIDOS. APÓS ESSE PRAZO OS VALORES PODEM SOFRER ALTERAÇÕES.\n\nAgradecemos pela preferência e pela confiança na Encantto3D! 💚`
        ].join('\n\n');
      }

      // Atualiza a barra de progresso superior conforme a etapa atual
      function updateProgressBar() {
        const pieceNum = String(state.currentPieceIndex + 1).padStart(2, '0');

        let stepLabel = 'Passo 1 de 5';
        let titleText = 'Dados do Atendimento';

        if (state.step === 'atendimento') {
          activeSeg = 0;
          stepLabel = 'Passo 1 de 5';
          titleText = 'Dados do Atendimento';
        } else if (state.step === 'piece-modeling-ask' || state.step === 'piece-modeling-type') {
          activeSeg = 1;
          stepLabel = `Passo 2 de 5 • Peça ${pieceNum}`;
          titleText = state.step === 'piece-modeling-ask'
            ? 'Modelagem 3D (Adição)'
            : 'Tipo de Modelagem 3D';
        } else if (state.step === 'piece-details') {
          activeSeg = 2;
          stepLabel = `Passo 3 de 5 • Peça ${pieceNum}`;
          titleText = 'Dados e Valores da Peça';
        } else if (state.step === 'piece-painting') {
          activeSeg = 3;
          stepLabel = `Passo 4 de 5 • Peça ${pieceNum}`;
          titleText = 'Pintura da Peça';
        } else if (state.step === 'result') {
          activeSeg = 4;
          stepLabel = 'Passo 5 de 5 • Concluído';
          titleText = 'Resultado Final & Edição por Toque';
        }

        dom.stepPillBadge.textContent = stepLabel;
        dom.stepTitleIndicator.textContent = titleText;

        dom.progressSegments.forEach((seg, idx) => {
          if (idx < activeSeg) {
            seg.className = 'h-2 rounded-full bg-brand-lime border border-brand-black transition-all';
          } else if (idx === activeSeg) {
            seg.className = 'h-2 rounded-full bg-brand-pink border border-brand-black transition-all';
          } else {
            seg.className = 'h-2 rounded-full bg-brand-black/15 dark:bg-white/15 border border-brand-black/30 transition-all';
          }
        });

        if (state.hasVisitedResult && state.step !== 'result') {
          dom.jumpToResultBtn.classList.remove('hidden');
        } else {
          dom.jumpToResultBtn.classList.add('hidden');
        }
      }

      function renderWizard() {
        updateProgressBar();

        if (state.step === 'atendimento') {

          renderStepModelingType();
        } else if (state.step === 'piece-details') {
          renderStepPieceDetails();
        } else if (state.step === 'piece-painting') {
          renderStepPiecePainting();
        } else if (state.step === 'result') {
          state.hasVisitedResult = true;
          updateProgressBar();
          renderStepResult();
        }
      }

              >
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
                </svg>
                <span>Novo Orçamento</span>
              </button>
            </div>
          </section>
        `;

        // Toque em qualquer parte do texto final abre o popup com o campo correspondente
        document.getElementById('interactive-quote-container').addEventListener('click', (e) => {
          const target = e.target.closest('[data-edit-type]');
          if (!target) return;
          const editType = target.dataset.editType;
          const pieceIdx = target.dataset.pieceIdx !== undefined ? parseInt(target.dataset.pieceIdx, 10) : 0;
          openQuickEditPopup(editType, pieceIdx);
        });

        // Excluir peça adicional na tela final
        dom.wizardStage.querySelectorAll('[data-remove-result-piece]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const idx = parseInt(btn.dataset.removeResultPiece, 10);
            if (state.pieces.length > 1 && !Number.isNaN(idx)) {
              state.pieces.splice(idx, 1);
              state.currentPieceIndex = Math.max(0, state.pieces.length - 1);
              renderStepResult();
              showToast('Peça removida do orçamento.');
            }
          });
        });

        // Adicionar outra peça seguindo o passo a passo
        document.getElementById('result-add-piece-btn').addEventListener('click', () => {
          state.pieces.push(createDefaultPiece());
          state.currentPieceIndex = state.pieces.length - 1;
          state.step = 'piece-modeling-ask';
          renderWizard();
        });

        document.getElementById('result-copy-btn').addEventListener('click', handleCopyClick);
        document.getElementById('result-whatsapp-btn').addEventListener('click', sendToWhatsApp);

        document.getElementById('result-back-btn').addEventListener('click', () => {
          state.currentPieceIndex = state.pieces.length - 1;
          state.step = 'piece-painting';
          renderWizard();
        });

        document.getElementById('result-new-quote-btn').addEventListener('click', () => {
          lastSnapshotBeforeReset = JSON.parse(JSON.stringify(state));
          state.clientName = '';
          state.deliveryDays = '7';
          state.hasInstallments = false;
          state.installmentsCount = '10';
          state.pieces = [createDefaultPiece()];
          state.currentPieceIndex = 0;
          state.hasVisitedResult = false;
          state.step = 'atendimento';
          renderWizard();
          showToast('Orçamento reiniciado.', true);
        });
      }

      // Salva os valores editados no popup e atualiza o texto final imediatamente
      function saveQuickEditPopup() {
        if (!activeQuickEdit) return;
        const { editType, pieceIdx } = activeQuickEdit;
        const piece = state.pieces[pieceIdx] || state.pieces[0];

        if (editType === 'client-name') {
          state.clientName = document.getElementById('qe-input').value;
        } else if (editType === 'seller-name') {
          state.sellerName = document.getElementById('qe-input').value;
          try {
            if (state.sellerName) localStorage.setItem(STORAGE_KEYS.SELLER, state.sellerName);
            else localStorage.removeItem(STORAGE_KEYS.SELLER);
          } catch (err) {}
        } else if (editType === 'piece-name') {
          piece.name = document.getElementById('qe-input').value;
        } else if (editType === 'piece-measure') {
          if (piece.measureMode === 'single') {
            piece.singleMeasure = document.getElementById('qe-input').value;
          } else {
            piece.dimL = document.getElementById('qe-dim-l').value;
            piece.dimA = document.getElementById('qe-dim-a').value;
            piece.dimP = document.getElementById('qe-dim-p').value;
          }
        } else if (editType === 'piece-quantity') {
          piece.quantity = Math.max(1, parseInt(document.getElementById('qe-input').value, 10) || 1);
        } else if (editType === 'piece-print-price') {
          piece.priceRaw = sanitizeMoneyInput(document.getElementById('qe-input').value);
        } else if (editType === 'piece-modeling' && piece.hasModeling) {
          if (piece.modelingType === 'ARTISTICA') {
            const p = document.getElementById('qe-mod-art-price');
            if (p) piece.modelingArtisticPriceRaw = sanitizeMoneyInput(p.value);
          } else {
            const h = document.getElementById('qe-mod-eng-hours');
            if (h) piece.modelingEngineeringHours = h.value;
          }
          const n = document.getElementById('qe-mod-notes');
          if (n) piece.modelingNotes = n.value;
        } else if (editType === 'piece-painting' && piece.hasPainting) {
          const pp = document.getElementById('qe-paint-price');
          const pd = document.getElementById('qe-paint-detail');
          if (pp) piece.paintPriceRaw = sanitizeMoneyInput(pp.value);
          if (pd) piece.paintDetail = pd.value;
        } else if (editType === 'delivery-days') {
          state.deliveryDays = document.getElementById('qe-input').value;
        } else if (editType === 'installments' && state.hasInstallments) {
          const ic = document.getElementById('qe-inst-count');
          if (ic) state.installmentsCount = ic.value;
        }

        closeQuickEditPopup();
        renderStepResult();
        showToast('Alteração salva no orçamento!');
      }

      function closeQuickEditPopup() {
        activeQuickEdit = null;
        dom.quickEditModal.classList.add('hidden');
        dom.quickEditModal.classList.remove('flex');
      }

      // Exibe notificação toast flutuante
      function showToast(message, showUndo = false) {
        dom.toastMessage.textContent = message;
        if (showUndo) {
          dom.toastUndoBtn.classList.remove('hidden');
        } else {
          dom.toastUndoBtn.classList.add('hidden');
        }

        dom.toast.classList.remove('opacity-0', 'translate-y-3', 'pointer-events-none');
        dom.toast.classList.add('opacity-100', 'translate-y-0');

        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          dom.toast.classList.add('opacity-0', 'translate-y-3', 'pointer-events-none');
          dom.toast.classList.remove('opacity-100', 'translate-y-0');
        }, showUndo ? 5500 : 2800);
      }

      // Verifica campos não preenchidos antes de copiar
      function getMissingFields() {
        const missing = [];

        if (!state.clientName.trim()) {
          missing.push({ tag: 'Atendimento', label: 'Nome do Cliente', editType: 'client-name', pieceIdx: 0 });
        }

        if (!state.sellerName.trim()) {
          missing.push({ tag: 'Atendimento', label: 'Nome do Vendedor', editType: 'seller-name', pieceIdx: 0 });
        }

        const days = parseInt(state.deliveryDays, 10);
        if (!String(state.deliveryDays || '').trim() || Number.isNaN(days) || days < 1) {
          missing.push({ tag: 'Entrega', label: 'Prazo de entrega (dias úteis)', editType: 'delivery-days', pieceIdx: 0 });
        }

        if (state.hasInstallments) {
          const inst = parseInt(state.installmentsCount, 10);
          if (!String(state.installmentsCount || '').trim() || Number.isNaN(inst) || inst < 2) {
            missing.push({ tag: 'Pagamento', label: 'Número de parcelas sem juros', editType: 'installments', pieceIdx: 0 });
          }
        }

        state.pieces.forEach((piece, idx) => {
          const numStr = `PEÇA ${String(idx + 1).padStart(2, '0')}`;

          if (piece.hasModeling) {
            if (piece.modelingType === 'ARTISTICA') {
              if (!piece.modelingArtisticPriceRaw.trim() || parseCurrency(piece.modelingArtisticPriceRaw) <= 0) {
                missing.push({ tag: numStr, label: 'Valor da Modelagem Artística (R$)', editType: 'piece-modeling', pieceIdx: idx });
              }
            } else {
              const hours = parseFloat(String(piece.modelingEngineeringHours || '').replace(',', '.'));
              if (!String(piece.modelingEngineeringHours || '').trim() || Number.isNaN(hours) || hours <= 0) {
                missing.push({ tag: numStr, label: 'Horas de Modelagem (Engenharia)', editType: 'piece-modeling', pieceIdx: idx });
              }
            }
          }

          if (!piece.name.trim()) {
            missing.push({ tag: numStr, label: 'Nome da Peça', editType: 'piece-name', pieceIdx: idx });
          }

          if (piece.measureMode === 'single') {
            if (!piece.singleMeasure.trim()) {
              missing.push({ tag: numStr, label: 'Medida Principal (cm)', editType: 'piece-measure', pieceIdx: idx });
            }
          } else if (!piece.dimL.trim() || !piece.dimA.trim() || !piece.dimP.trim()) {
            missing.push({ tag: numStr, label: 'Medida Principal (L × A × P)', editType: 'piece-measure', pieceIdx: idx });
          }

          if (!piece.priceRaw.trim() || parseCurrency(piece.priceRaw) <= 0) {
            missing.push({ tag: numStr, label: 'Valor da Impressão (R$)', editType: 'piece-print-price', pieceIdx: idx });
          }

          if (piece.hasPainting && (!piece.paintPriceRaw.trim() || parseCurrency(piece.paintPriceRaw) <= 0)) {
            missing.push({ tag: numStr, label: 'Valor da Pintura (R$)', editType: 'piece-painting', pieceIdx: idx });
          }
        });

        return missing;
      }

      function openValidationModal(missingItems) {
        firstMissingItem = missingItems[0] || null;
        dom.missingFieldsList.innerHTML = missingItems
          .map(
            (item) => `
              <li class="flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-white dark:bg-brand-darkElevated border-[1.5px] border-brand-black/20 dark:border-brand-darkBorder text-xs">
                <span class="font-bold text-brand-black dark:text-white">${escapeAttr(item.label)}</span>
                <span class="shrink-0 px-2 py-0.5 rounded-md bg-brand-black text-brand-lime font-display font-extrabold text-[10px]">
                  ${escapeAttr(item.tag)}
                </span>
              </li>
            `
          )
          .join('');

        dom.validationModal.classList.remove('hidden');
        dom.validationModal.classList.add('flex');
        dom.modalEditBtn.focus();
      }

      function closeValidationModal(openEditAfter = false) {
        dom.validationModal.classList.add('hidden');
        dom.validationModal.classList.remove('flex');

        if (openEditAfter && firstMissingItem) {
          openQuickEditPopup(firstMissingItem.editType, firstMissingItem.pieceIdx);
        }
      }

      function performCopyToClipboard() {
        const text = buildPlainQuoteText();

        const onSuccess = () => {
          const copyIcon = document.getElementById('copy-icon');
          const checkIcon = document.getElementById('check-icon');
          const copyBtnText = document.getElementById('copy-btn-text');

          if (copyIcon) copyIcon.classList.add('hidden');
          if (checkIcon) checkIcon.classList.remove('hidden');
          if (copyBtnText) copyBtnText.textContent = 'Orçamento Copiado!';
          showToast('Orçamento copiado para a área de transferência!');

          setTimeout(() => {
            if (copyIcon) copyIcon.classList.remove('hidden');
            if (checkIcon) checkIcon.classList.add('hidden');
            if (copyBtnText) copyBtnText.textContent = 'Copiar Orçamento';
          }, 2200);
        };

        const fallbackCopy = () => {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          try {
            document.execCommand('copy');
            onSuccess();
          } catch (err) {
            showToast('Não foi possível copiar automaticamente.');
          }
          document.body.removeChild(textarea);
        };

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(onSuccess).catch(fallbackCopy);
        } else {
          fallbackCopy();
        }
      }

      function handleCopyClick() {
        const missing = getMissingFields();
        if (missing.length > 0) {
          openValidationModal(missing);
          return;
        }
        performCopyToClipboard();
      }

      function sendToWhatsApp() {
        const text = buildPlainQuoteText();
        const encoded = encodeURIComponent(text);
        window.open(`https://wa.me/?text=${encoded}`, '_blank', 'noopener,noreferrer');
      }

      function applyTheme(isDark) {
        const htmlEl = document.documentElement;
        if (isDark) {
          htmlEl.classList.add('dark');
          dom.iconSun.classList.remove('hidden');
          dom.iconMoon.classList.add('hidden');
          dom.themeLabel.textContent = 'Modo Claro';
        } else {
          htmlEl.classList.remove('dark');
          dom.iconSun.classList.add('hidden');
          dom.iconMoon.classList.remove('hidden');
          dom.themeLabel.textContent = 'Modo Escuro';
        }
      }

      function bindGlobalEvents() {
        dom.jumpToResultBtn.addEventListener('click', () => {
          state.step = 'result';
          renderWizard();
        });

        dom.toastUndoBtn.addEventListener('click', () => {
          if (!lastSnapshotBeforeReset) return;
          state = lastSnapshotBeforeReset;
          lastSnapshotBeforeReset = null;
          renderWizard();
          showToast('Orçamento restaurado!');
        });

        // Modal de Aviso de Segurança
        dom.modalEditBtn.addEventListener('click', () => closeValidationModal(true));
        dom.modalConfirmCopyBtn.addEventListener('click', () => {
          closeValidationModal(false);
          performCopyToClipboard();
        });
        dom.validationModal.addEventListener('click', (e) => {
          if (e.target === dom.validationModal) closeValidationModal(false);
        });

        // Popup de Edição Rápida
        dom.quickEditCloseBtn.addEventListener('click', closeQuickEditPopup);
        dom.quickEditCancelBtn.addEventListener('click', closeQuickEditPopup);
        dom.quickEditSaveBtn.addEventListener('click', saveQuickEditPopup);
        dom.quickEditModal.addEventListener('click', (e) => {
          if (e.target === dom.quickEditModal) closeQuickEditPopup();
        });
        dom.quickEditBody.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            saveQuickEditPopup();
          }
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            if (!dom.quickEditModal.classList.contains('hidden')) closeQuickEditPopup();
            if (!dom.validationModal.classList.contains('hidden')) closeValidationModal(false);
          }
        });

        // Alternar Tema
        dom.themeToggle.addEventListener('click', () => {
          const isDark = !document.documentElement.classList.contains('dark');
          applyTheme(isDark);
          try {
            localStorage.setItem(STORAGE_KEYS.THEME, isDark ? 'dark' : 'light');
          } catch (err) {}
        });
      }

      function init() {
        let savedSeller = '';
        let savedTheme = '';

        try {
          savedSeller = localStorage.getItem(STORAGE_KEYS.SELLER) || '';
          savedTheme = localStorage.getItem(STORAGE_KEYS.THEME) || '';
        } catch (err) {}

        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(savedTheme ? savedTheme === 'dark' : prefersDark);

        if (savedSeller && SELLERS.includes(savedSeller)) {
          state.sellerName = savedSeller;
        } else {
          state.sellerName = '';
        }

        state.pieces = [createDefaultPiece()];
        bindGlobalEvents();
        renderWizard();
      }

      init();
    })();
  </script>
</body>
</html>
